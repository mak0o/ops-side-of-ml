services:
  # 1. MLflowサーバー
  mlflow-server:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    volumes:
      - ./mlflow_db:/mlflow_db
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://s3:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow_db/mlflow.db
      - --default-artifact-root
      - s3://mlflow-bucket
      - --allowed-hosts
      - mlflow-server,mlflow-server:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*
    ports:
      - "127.0.0.1:5001:5000"
    depends_on:
      - s3
    networks:
      - mlflow-net  
  

  # 2. 推論アプリ & 実験実行用コンテナ
  ml-app:
    build:
      context: .
      dockerfile: docker/ml-app.Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - MLFLOW_S3_ENDPOINT_URL=http://s3:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
    depends_on:
      - mlflow-server
      - s3
    networks:
      - mlflow-net

  # 3. MinIO (S3互換ストレージ)
  s3:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: always
    ports:
      - "127.0.0.1:9005:9000"
      - "127.0.0.1:9006:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_STORAGE_CLASS_STANDARD: "EC:0"
    command: server /data --console-address ":9001"
    networks:
      - mlflow-net
    volumes:
      - minio_persistent_data:/data

  # 4. バケット作成（起動時に一度だけ実行して終了）
  createbuckets:
    image: quay.io/minio/mc
    depends_on:
      - s3
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://s3:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 1; done;
      mc mb --ignore-existing myminio/mlflow-bucket;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - mlflow-net

  # 5. Terraform (AWS構成管理)
  terraform:
    build:
      context: .
      dockerfile: docker/terraform.Dockerfile
    working_dir: /work
    volumes:
      - ./infra:/work
      - ~/.aws:/root/.aws:ro
      - ~/.aws/sso:/root/.aws/sso:ro
      - aws_cli_cache:/root/.aws/cli
    environment:
      - AWS_REGION=ap-northeast-1
      - AWS_PROFILE=${AWS_PROFILE}
    profiles: ["tools"]

  # 6. AWS 操作用（SageMaker ジョブ起動など）
  awscli:
    build:
      context: .
      dockerfile: docker/aws.Dockerfile
    working_dir: /work
    volumes:
      - .:/work
      - ~/.aws:/root/.aws:ro
      - ~/.aws/sso:/root/.aws/sso
      - aws_cli_cache:/root/.aws/cli
    environment:
      - AWS_REGION=ap-northeast-1
      - AWS_PROFILE=${AWS_PROFILE}
    profiles: ["tools"]
  
networks:
  mlflow-net:
    driver: bridge

volumes:
  minio_persistent_data:
  aws_cli_cache: