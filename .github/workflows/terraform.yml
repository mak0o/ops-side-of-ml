name: terraform

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'

env:
  AWS_REGION: ap-northeast-1
  TF_VERSION: 1.14.0

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # PR へのコメントは plan だけが必要。apply には付けない
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::320813594497:role/ops-side-of-ml-gha-plan
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        working-directory: infra
        run: terraform init -backend-config=backend.ci.hcl

      - name: Format check
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Validate
        working-directory: infra
        run: terraform validate

      - name: Plan
        id: plan
        working-directory: infra
        run: terraform plan -no-color -lock=false -var-file=terraform.ci.tfvars
        continue-on-error: true

      # plan の出力をスクリプトに直接埋め込むと、出力に ` や ${ が含まれたときにコードとして実行される。
      # 環境変数で渡し、スクリプトの中では文字列として扱う。
      - name: Comment plan on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fence = "```";
            const body = [
              `#### Terraform Plan \`${process.env.OUTCOME}\``,
              "",
              "<details><summary>詳細</summary>",
              "",
              `${fence}terraform`,
              process.env.PLAN,
              fence,
              "",
              "</details>",
            ].join("\n");
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::320813594497:role/ops-side-of-ml-gha-apply
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        working-directory: infra
        run: terraform init -backend-config=backend.ci.hcl

      - name: Apply
        working-directory: infra
        run: terraform apply -auto-approve -var-file=terraform.ci.tfvars
