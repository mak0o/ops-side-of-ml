name: image

on:
  push:
    branches: [main]
    paths:
      - 'docker/train.Dockerfile'
      - 'docker/train-entrypoint.sh'
      - 'docker/serve.Dockerfile'
      - 'docker/serve-entrypoint.sh'
      - 'requirements-train.lock'
      - 'requirements-serve.lock'
      - 'src/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1

jobs:
  push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [train, serve]
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::320813594497:role/ops-side-of-ml-gha-push
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REPO: 320813594497.dkr.ecr.ap-northeast-1.amazonaws.com/ops-side-of-ml/${{ matrix.image }}
        run: |
          # コミットハッシュでタグ付けし、どのコードから作られたか追えるようにする
          docker build -f docker/${{ matrix.image }}.Dockerfile \
            -t "$REPO:${{ github.sha }}" \
            -t "$REPO:latest" .
          docker push "$REPO:${{ github.sha }}"
          docker push "$REPO:latest"