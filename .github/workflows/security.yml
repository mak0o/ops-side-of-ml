name: security
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # latest は付け替えられるのでバージョンを固定する。Dependabot は run 内のイメージを追えないので手で更新する
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source /repo
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.lock
      - run: pip-audit -r requirements-train.lock
      - run: pip-audit -r requirements-serve.lock
      - run: pip-audit -r requirements-dev.lock
