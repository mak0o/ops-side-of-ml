# Actions は SHA で固定しているので、更新は Dependabot に任せる。
# SHA と末尾のバージョンのコメントをまとめて書き換えた PR が来る。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # マイナー・パッチ版は互換性の問題が出にくいので 1 つの PR にまとめる
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # メジャー版はどのグループにも入らず、アクションごとに個別の PR になる。
    # リリースノートを確認してからマージする
